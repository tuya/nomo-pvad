name: release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/ci.yml

  tag-and-release:
    needs: checks
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Publish or resume verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py
