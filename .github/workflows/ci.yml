name: ci

on:
  pull_request:
    branches: [master, dev]
  push:
    branches: [master, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      # 锁版本：ruff 的默认规则集会随版本变化，不锁会导致 CI 因升级而无故变红。
      # 规则集本身在仓库根目录的 ruff.toml 里显式声明。
      - run: pip install ruff==0.16.3
      - name: ruff check
        run: ruff check --output-format=github .

  no-internal-refs:
    name: no-internal-refs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 扫描内部信息泄漏（全部文件）
        run: |
          PATTERN='tuya-inc|registry\.code|wgine\.com/[0-9a-f]{16,}|BEGIN [A-Z ]*PRIVATE KEY|10\.[0-9]+\.[0-9]+\.[0-9]+|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]+'
          if git grep -InE "$PATTERN" -- ':!.github/workflows/ci.yml'; then
            echo "::error::检测到内部域名/IP/密钥，见上方命中行"
            exit 1
          fi
          echo "✅ 无内部信息泄漏"

      # 只扫 Python 源码：文档中会正当引用 weights_only=False 作为禁令，不能一并拦截
      - name: 禁止 weights_only=False（仅 *.py）
        run: |
          if git grep -InE 'weights_only\s*=\s*False' -- '*.py'; then
            echo "::error::torch.load 必须使用 weights_only=True，禁止 False（pickle 反序列化 RCE）"
            exit 1
          fi
          echo "✅ 所有 torch.load 均为 weights_only=True"

  smoke-infer:
    name: smoke-infer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODELSCOPE_CACHE: ${{ github.workspace }}/.modelscope-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      # ERes2NetV2 声纹骨干需从 modelscope 下载，缓存后仅首次联网
      - uses: actions/cache@v4
        with:
          path: ${{ env.MODELSCOPE_CACHE }}
          key: modelscope-eres2netv2-v1

      - name: 安装依赖（torch 走 CPU wheel，省 ~2GB）
        run: |
          pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: 校验权重完整性
        working-directory: weights
        run: shasum -a 256 -c CHECKSUMS.txt

      - name: 冒烟推理
        run: |
          python infer.py \
            --enroll examples/enroll.wav \
            --test examples/test.wav \
            --fast --verbose | tee out.txt
          grep -q '结论：' out.txt || { echo "::error::推理未输出结论行"; exit 1; }

      - name: 校验 VERSION 格式
        run: |
          V="$(tr -d '[:space:]' < VERSION)"
          echo "$V" | grep -qE '^[0-9]+\.[0-9]+$' \
            || { echo "::error::VERSION 必须为 X.Y，实际 '$V'"; exit 1; }
          echo "VERSION = $V"
