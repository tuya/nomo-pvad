name: 功能建议
description: 希望新增的能力
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: 本仓库**只含推理代码**，不接受训练相关的功能请求。
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述你的实际场景与当前的阻塞点，而不是直接给方案
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
  - type: checkboxes
    id: contrib
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提 PR 实现它
