name: Bug 报告
description: 代码报错、崩溃、行为与文档不符
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **安全漏洞请勿在此提交**，请走 Security → Report a vulnerability，联系方式见 SECURITY.md。
        ⚠️ **识别不准/误报漏报**属于效果问题，请用「效果问题」模板。
  - type: textarea
    id: what
    attributes:
      label: 问题描述
      description: 期望的行为是什么，实际发生了什么
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: 复现命令
      description: 完整命令行，含参数
      render: shell
      value: python infer.py --enroll examples/enroll.wav --test examples/test.wav --verbose
    validations: { required: true }
  - type: textarea
    id: log
    attributes:
      label: 完整报错栈
      render: text
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: nomo-pvad 版本
      description: VERSION 文件内容，或所用的 tag（如 release-1.0）
    validations: { required: true }
  - type: textarea
    id: env
    attributes:
      label: 运行环境
      description: "粘贴输出：python -c \"import sys,torch,torchaudio,numpy;print(sys.version,torch.__version__,torchaudio.__version__,numpy.__version__)\" 以及操作系统"
      render: shell
    validations: { required: true }
  - type: input
    id: audio
    attributes:
      label: 音频信息
      description: 采样率、声道数、时长；用自带 examples 复现请写 examples
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已用最新的 release-X.Y 复现过
          required: true
        - label: 我已执行 `cd weights && shasum -a 256 -c CHECKSUMS.txt` 且结果为 OK
          required: true
